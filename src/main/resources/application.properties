spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen3:0.6b}
spring.ai.ollama.chat.keep-alive=5m
spring.ai.ollama.chat.think=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/subinjector}
spring.datasource.username=${DATABASE_USERNAME:subinjector}
spring.datasource.password=${DATABASE_PASSWORD:subinjector-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
subinjector.enrichment.worker.enabled=${ENRICHMENT_WORKER_ENABLED:true}
subinjector.enrichment.worker.poll-delay=${ENRICHMENT_WORKER_POLL_DELAY:500}
subinjector.enrichment.worker.initial-delay=${ENRICHMENT_WORKER_INITIAL_DELAY:5000}
