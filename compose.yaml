name: subinjector

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subinjector
      POSTGRES_USER: subinjector
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-subinjector-local}
    ports:
      - "5432:5432"
    volumes:
      - subinjector-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subinjector -d subinjector"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subinjector-postgres-data:
